<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{width:440px;height:280px;background:#0a0b0d;overflow:hidden;position:relative}
.glow{position:absolute;width:360px;height:360px;border-radius:50%;background:#c2f64a;filter:blur(80px);opacity:.15;top:-130px;left:-80px}
.grid{position:absolute;inset:0;background-image:linear-gradient(#232932 1px,transparent 1px),linear-gradient(90deg,#232932 1px,transparent 1px);background-size:40px 40px;opacity:.20}
.wrap{position:relative;z-index:1;padding:30px 32px;height:100%;display:flex;flex-direction:column;justify-content:center}
.brand{font-weight:800;font-size:23px;letter-spacing:-1px;color:#e9e7df;margin-bottom:16px}.brand b{color:#c2f64a}
h1{font-weight:800;font-size:33px;line-height:1.05;letter-spacing:-1.5px;color:#e9e7df}h1 em{font-style:normal;color:#c2f64a}
.chips{display:flex;gap:7px;margin-top:18px;flex-wrap:wrap}
.chips span{font-size:11px;color:#9aa3ad;border:1px solid #2f3742;border-radius:20px;padding:6px 11px}
.chips span b{color:#c2f64a;font-weight:700}
</style></head><body>
<div class="glow"></div><div class="grid"></div>
<div class="wrap">
  <div class="brand">MARGIN<b>PAD</b></div>
  <h1>5 crypto calculators.<br><em>One click away.</em></h1>
  <div class="chips"><span><b>&bull;</b> Liquidation</span><span><b>&bull;</b> Position size</span><span><b>&bull;</b> PnL</span><span><b>&bull;</b> DCA</span></div>
</div>
</body></html>
