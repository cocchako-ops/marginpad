name = "marginpad"
main = "src/worker.js"
compatibility_date = "2026-06-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
# SSR live-data injection (2026-08-03): ONLY these paths go worker-first (everything else keeps the fast
# static path). The worker injects a crawler-visible live-data block; on any data gap it serves the static
# file unchanged. See handleSsrCoin/handleSsrBlog in worker.js.
run_worker_first = ["/coin/*", "/blog/what-is-funding-rate/*", "/blog/funding-rate-arbitrage/*", "/blog/what-is-liquidation-in-crypto/*", "/blog/how-to-avoid-liquidation-crypto/*", "/blog/long-short-ratio-explained/*", "/blog/crypto-leverage-explained/*", "/blog/what-leverage-to-use-crypto/*", "/blog/btc-dominance-altcoin-season/*", "/blog/crypto-options-expiry-btc/*", "/*-liquidation-calculator/*", "/*-liquidation-map/*", "/blog/cpi-week-crypto-playbook/*", "/blog/nfp-bitcoin-jobs-report/*", "/blog/pce-inflation-crypto/*", "/blog/fomc-july-2026-bitcoin/*", "/blog/crypto-economic-calendar-guide/*"]

[triggers]
crons = ["*/10 * * * *", "* * * * *"]

# Persisted, searchable logs (Workers Logs) so console.error('srverr', …) is queryable in the
# Cloudflare dashboard after the fact — not just in a live `wrangler tail`. head_sampling_rate=1 = keep all.
[observability]
enabled = true
head_sampling_rate = 1

[vars]
# Base URL of the separate liquidation collector (its own VPS), WITHOUT the /api/v1 suffix — the Worker
# proxy appends the full path. Reached via a Cloudflare-proxied subdomain so TLS is valid + origin IP hidden.
# Empty = graceful fallback (heatmap shows theoretical lines).
COLLECTOR_URL = "https://collector.marginpad.io"
# Cloudflare account id — used by the stats dashboard to query Analytics Engine (read) via the SQL API.
# Not secret; the read token is the Wrangler secret CF_API_TOKEN.
CF_ACCOUNT_ID = "877b9a26e1603197fb64fb046ecd72cd"
# Reward faucet (non-secret config; TURNSTILE_SECRET is a Wrangler secret). REWARD_ENABLED stays "0" until the
# wallet is funded + Turnstile secret is set — then flip to "1". REWARD_DAILY_CAP is the global $/day budget ceiling.
REWARD_ENABLED = "1"
REWARD_DAILY_CAP = "20"
REWARD_PER_DAY = "1"

[[kv_namespaces]]
binding = "STATS"
id = "0bf59a5bf3d148cd9af4b2d3741c1077"

# R2 — nightly DO backups (7-day rotation + latest). nightlyBackup prefers this over the KV fallback.
[[r2_buckets]]
binding = "BACKUP"
bucket_name = "marginpad-backup"

# Analytics Engine — scale-safe event capture (no KV write-quota, no read-modify-write races).
# Written alongside KV for now; the dashboard can migrate to query this once an account API token is set.
[[analytics_engine_datasets]]
binding = "AE"
dataset = "marginpad_events"

[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatRoom"

[[durable_objects.bindings]]
name = "REWARDS"
class_name = "RewardLedger"

[[durable_objects.bindings]]
name = "USERS"
class_name = "UserStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RewardLedger"]

[[durable_objects.bindings]]
name = "COMM"
class_name = "Community"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["UserStore"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["Community"]

# Demo Spot (2026-08-02): server-authoritative demo spot wallets ($10k USDT, CEX coins + Solana memes).
# Deliberately its OWN DO class — UserStore 'main' is already the hot single instance (has reset under load).
[[durable_objects.bindings]]
name = "SPOT"
class_name = "SpotStore"

[[migrations]]
tag = "v5"
new_sqlite_classes = ["SpotStore"]

# ============================================================================
# STAGING ENVIRONMENT (deploy: wrangler deploy --env staging → separate script
# `marginpad-staging`, so ALL Durable Objects are physically separate instances).
# NOT DEPLOYED YET — awaiting review of the resolved bindings (--dry-run) + the
# worker.js guards (boot assertion / gate / OTP bypass). WRANGLER GOTCHA: binding
# ARRAYS are REPLACED per env, not merged — so every DO/KV/AE/R2 binding is
# re-listed here in full. Omitting one would make staging INHERIT the prod array
# (shared fate). None of the DO bindings set script_name → each references the
# class in THIS (staging) script = its own namespace.
# ============================================================================
[env.staging]
name = "marginpad-staging"
workers_dev = true              # marginpad-staging.<account>.workers.dev — zero DNS

[env.staging.triggers]
crons = []                      # SUSPENDERS: register NO cron for staging (belt = the ENVIRONMENT==='staging' return at the top of scheduled()). Arrays are replaced per-env, so this fully overrides the top-level crons.

[env.staging.vars]
ENVIRONMENT = "staging"         # drives the boot assertion + gate + noindex + OTP bypass in worker.js
CF_ACCOUNT_ID = "877b9a26e1603197fb64fb046ecd72cd"
COLLECTOR_URL = ""              # graceful fallback — no dependency on the prod collector
REWARD_ENABLED = "0"            # faucet OFF (rewardCfg reads this → enabled:false, loudly off)
REWARD_DAILY_CAP = "20"
REWARD_PER_DAY = "1"

[env.staging.assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true         # CRITICAL: worker runs BEFORE static assets, so the gate + X-Robots-Tag
                                # cover all 1.836 dist/ pages (default false serves them before the worker)

[[env.staging.kv_namespaces]]
binding = "STATS"
id = "841bae1f70b74c3c88f431bcdeed48cb"   # STATS_staging (separate namespace — created 2026-07-25)

[[env.staging.analytics_engine_datasets]]
binding = "AE"
dataset = "marginpad_events_staging"       # SEPARATE dataset — never pollute the prod baseline again

[[env.staging.r2_buckets]]
binding = "BACKUP"
bucket_name = "marginpad-backup-staging"   # separate bucket (backup cron is off on staging anyway)

[[env.staging.durable_objects.bindings]]
name = "CHAT"
class_name = "ChatRoom"
[[env.staging.durable_objects.bindings]]
name = "REWARDS"
class_name = "RewardLedger"
[[env.staging.durable_objects.bindings]]
name = "USERS"
class_name = "UserStore"
[[env.staging.durable_objects.bindings]]
name = "COMM"
class_name = "Community"
[[env.staging.durable_objects.bindings]]
name = "SPOT"
class_name = "SpotStore"
