name = "marginpad"
main = "src/worker.js"
compatibility_date = "2026-06-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"

[triggers]
crons = ["*/10 * * * *"]

[vars]
# Base URL of the separate liquidation collector (its own VPS), WITHOUT the /api/v1 suffix — the Worker
# proxy appends the full path. Reached via a Cloudflare-proxied subdomain so TLS is valid + origin IP hidden.
# Empty = graceful fallback (heatmap shows theoretical lines).
COLLECTOR_URL = "https://collector.marginpad.io"

[[kv_namespaces]]
binding = "STATS"
id = "0bf59a5bf3d148cd9af4b2d3741c1077"

[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]
