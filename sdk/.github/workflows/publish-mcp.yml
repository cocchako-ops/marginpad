name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # THE TAG IS THE RELEASE, SO THE MANIFEST MUST NAME IT (2026-10-25). publish-sdk.yml refuses a release
      # whose four version strings disagree; mcp/server.json is a FIFTH and was in no check at all, so the
      # v3.0.1 tag published npm and PyPI at 3.0.1 and asked this registry for 3.0.0. It failed only because
      # 3.0.0 already existed - otherwise the registry would now list a version nobody can install.
      - name: server.json must name the version the tag names
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          man=$(node -p "require('./mcp/server.json').version")
          echo "tag $tag  ·  mcp/server.json $man"
          if [ "$tag" != "$man" ]; then echo "::error::mcp/server.json says $man but the tag says $tag"; exit 1; fi

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: cd mcp && ../mcp-publisher publish
