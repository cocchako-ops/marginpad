<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{--bg:#0a0b0d;--bg-grain:#0d0f12;--panel:#111419;--panel-2:#161a21;--line:#232932;--line-bright:#2f3742;--ink:#e9e7df;--ink-dim:#9aa3ad;--ink-faint:#5c656f;--up:#2ebd85;--red:#ff6258;}
  body{background:var(--bg);color:var(--ink);font-family:'Familjen Grotesk',system-ui,sans-serif;min-height:100vh;padding:22px 18px 90px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:640px;margin:0 auto;}
  @media (display-mode:standalone){ body{ padding-top:calc(22px + env(safe-area-inset-top)); } }
  .jhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .back{display:inline-flex;align-items:center;gap:7px;color:var(--ink-dim);text-decoration:none;font-family:'Space Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:.08em;padding:8px 12px;border:1px solid var(--line-bright);border-radius:9px;transition:.15s;}
  .back:hover{color:#fff;border-color:var(--ink-faint);}
  .jtitle{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:21px;}
  .jr-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px;}
  @media(max-width:560px){.jr-stats{grid-template-columns:repeat(2,1fr);}}
  .jr-stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;}
  .jr-stat .v{font-family:'Space Mono',monospace;font-size:21px;font-weight:700;line-height:1;}
  .jr-stat .l{color:var(--ink-faint);font-size:10px;text-transform:uppercase;letter-spacing:.07em;margin-top:6px;}
  .jr-list{display:flex;flex-direction:column;gap:14px;}
  .ticket{display:flex;background:linear-gradient(135deg,#161a20,#0f1216);border:1px solid var(--line-bright);border-radius:12px;position:relative;box-shadow:0 6px 18px rgba(0,0,0,.35);}
  .ticket.long{box-shadow:0 6px 18px rgba(0,0,0,.35),inset 3px 0 0 0 rgba(46,189,133,.6);}
  .ticket.short{box-shadow:0 6px 18px rgba(0,0,0,.35),inset 3px 0 0 0 rgba(255,98,88,.6);}
  .tk-main{flex:1;padding:14px 16px;min-width:0;}
  .tk-top{display:flex;align-items:center;gap:9px;margin-bottom:11px;}
  .tk-sym{font-family:'Space Mono',monospace;font-weight:700;font-size:17px;}
  .tk-side{font-size:10px;text-transform:uppercase;padding:3px 8px;border-radius:5px;font-family:'Space Mono',monospace;letter-spacing:.05em;}
  .tk-side.long{color:var(--up);background:rgba(46,189,133,.13);}
  .tk-side.short{color:var(--red);background:rgba(255,98,88,.13);}
  .tk-rows{display:grid;grid-template-columns:1fr 1fr;gap:5px 16px;}
  .tk-rows div{display:flex;justify-content:space-between;gap:8px;font-family:'Space Mono',monospace;font-size:12.5px;}
  .tk-rows span{color:var(--ink-faint);}
  .tk-rows b{color:var(--ink);font-weight:600;}
  .tk-stub{width:84px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:12px 8px;position:relative;border-left:2px dashed var(--line-bright);}
  .tk-stub::before,.tk-stub::after{content:"";position:absolute;left:-8px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:1px solid var(--line-bright);}
  .tk-stub::before{top:-8px;}.tk-stub::after{bottom:-8px;}
  .tk-result{font-family:'Space Mono',monospace;font-weight:700;font-size:14px;text-align:center;line-height:1.2;}
  .tk-result.pos{color:var(--up);}.tk-result.neg{color:var(--red);}
  .tk-tag{font-family:'Space Mono',monospace;font-size:8.5px;text-transform:uppercase;color:var(--ink-faint);letter-spacing:.08em;}
  .tk-btn{border:1px solid var(--line-bright);background:var(--bg);color:var(--ink-dim);border-radius:7px;padding:6px 0;font-size:11px;cursor:pointer;font-family:'Space Mono',monospace;width:100%;transition:.12s;}
  .tk-btn.win:hover{color:var(--up);border-color:var(--up);}
  .tk-btn.loss:hover{color:var(--red);border-color:var(--red);}
  .tk-del{position:absolute;top:5px;right:7px;background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:11px;padding:2px;line-height:1;z-index:1;}
  .tk-del:hover{color:var(--red);}
  .jr-empty{color:var(--ink-faint);text-align:center;padding:48px 20px;font-size:15px;line-height:1.6;}
  .jr-empty a{color:var(--up);text-decoration:none;}
  .cta{display:inline-block;margin-top:16px;background:var(--up);color:#04150d;font-family:'Space Mono',monospace;font-size:13px;font-weight:700;padding:11px 20px;border-radius:10px;text-decoration:none;}
  .mobnav{position:fixed;bottom:0;left:0;right:0;z-index:55;display:flex;justify-content:space-around;align-items:center;padding:13px 0 calc(env(safe-area-inset-bottom) + 16px);background:rgba(11,12,15,.74);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border-top:1px solid rgba(255,255,255,.1);}
  .mobnav a{flex:1;background:none;border:none;color:rgba(255,255,255,.62);display:flex;align-items:center;justify-content:center;text-decoration:none;padding:3px 0;transition:transform .12s,color .12s;}
  .mobnav a.active{color:#fff;}
  .mobnav a:active{transform:scale(.86);}
</style>
</head>
<body>
<div class="wrap">
  <div class="jhead">
    <span class="jtitle">🎟️ <span data-i18n="jrTitle">Trade Journal</span></span>
    <a class="back" href="/">← <span data-i18n="jBack">Calculator</span></a>
  </div>
  <div class="jr-stats" id="jrStats"></div>
  <div class="jr-list" id="jrList"></div>
  <p class="jr-empty" id="jrEmpty"><span data-i18n="jEmptyTitle">No tickets yet.</span><br><span data-i18n="jEmptyBody">Plan a trade and tap “Save to journal” to keep it here.</span><br><a class="cta" href="/#plan"><span data-i18n="jPlanCta">Plan a trade</span> →</a></p>
</div>
<nav class="mobnav" aria-label="Quick navigation">
  <a href="/" aria-label="Calculator"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="14" x2="16" y2="18"/><line x1="8" y1="18" x2="12" y2="18"/></svg></a>
  <a href="/#trending" aria-label="Markets"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg></a>
  <a href="/journal/" class="active" aria-label="Journal"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></a>
  <a href="/?chat=1" aria-label="Chat"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7a8.5 8.5 0 0 1-.9-3.8 8.38 8.38 0 0 1 8.5-8.5 8.5 8.5 0 0 1 8.5 8.5z"/></svg></a>
</nav>
<script>try{fetch('/api/track?t=pageview&p=%2Fjournal%2F')}catch(e){}</script>
<script src="/assets/i18n.js"></script>
<script>
(function(){
  var KEY='mp_journal';
  function MT(k,d){return (window.mpT&&window.mpT(k))||d;}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[];}catch(e){return [];}}
  function store(a){try{localStorage.setItem(KEY,JSON.stringify(a));}catch(e){}}
  function esc(s){return String(s).replace(/[<>&]/g,function(m){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[m];});}
  function money(x){x=+x||0;var n=x<0;x=Math.abs(x);return (n?'-$':'$')+x.toLocaleString('en-US',{maximumFractionDigits:2});}
  function render(){
    var listEl=document.getElementById('jrList'),statsEl=document.getElementById('jrStats'),emptyEl=document.getElementById('jrEmpty');
    var data=load();
    var closed=data.filter(function(e){return e.status==='win'||e.status==='loss';});
    var wins=closed.filter(function(e){return e.status==='win';}).length;
    var wr=closed.length?Math.round(wins/closed.length*100):null;
    var net=closed.reduce(function(s,e){return s+(+e.pnl||0);},0);
    var rrArr=data.filter(function(e){return isFinite(e.rr);});
    var avgRR=rrArr.length?(rrArr.reduce(function(s,e){return s+e.rr;},0)/rrArr.length):null;
    function stat(v,l){return '<div class="jr-stat"><div class="v">'+v+'</div><div class="l">'+l+'</div></div>';}
    statsEl.innerHTML=stat(data.length,MT('jTrades','Trades'))+stat(wr==null?'—':wr+'%',MT('jWinRate','Win rate'))+stat(avgRR==null?'—':avgRR.toFixed(2),MT('jAvgRR','Avg R:R'))+stat((net>=0?'+':'−')+money(net).replace('-',''),MT('jNetPnl','Net PnL'));
    listEl.innerHTML=data.slice().reverse().map(function(e){
      var sideC=e.side==='short'?'short':'long';
      var stub=e.status==='planned'
        ? '<span class="tk-tag">'+MT('jResultQ','result?')+'</span><button class="tk-btn win" data-act="win" data-id="'+e.id+'">✓ '+MT('jWin','Win')+'</button><button class="tk-btn loss" data-act="loss" data-id="'+e.id+'">✗ '+MT('jLoss','Loss')+'</button>'
        : '<span class="tk-result '+((+e.pnl)>=0?'pos':'neg')+'">'+((+e.pnl)>=0?'+':'−')+money(e.pnl).replace('-','')+'</span><span class="tk-tag">'+(e.status==='win'?MT('jWon','WIN'):MT('jLost','LOSS'))+'</span>';
      return '<div class="ticket '+sideC+'">'
        +'<button class="tk-del" data-act="del" data-id="'+e.id+'" aria-label="Delete">✕</button>'
        +'<div class="tk-main"><div class="tk-top"><span class="tk-sym">'+esc(e.sym||'—')+'</span><span class="tk-side '+sideC+'">'+esc(e.side)+'</span></div>'
        +'<div class="tk-rows"><div><span>'+MT('jEntry','Entry')+'</span><b>'+esc(String(e.entry))+'</b></div>'
        +'<div><span>'+MT('jStop','Stop')+'</span><b>'+esc(String(e.stop))+'</b></div>'
        +'<div><span>'+MT('jTarget','Target')+'</span><b>'+(e.tp!=null?esc(String(e.tp)):'—')+'</b></div>'
        +'<div><span>'+MT('jRR','R:R')+'</span><b>'+(isFinite(e.rr)?e.rr.toFixed(2):'—')+'</b></div></div></div>'
        +'<div class="tk-stub">'+stub+'</div></div>';
    }).join('');
    if(emptyEl)emptyEl.style.display=data.length?'none':'';
  }
  document.getElementById('jrList').addEventListener('click',function(ev){
    var b=ev.target.closest&&ev.target.closest('[data-act]'); if(!b)return;
    var id=b.getAttribute('data-id'),act=b.getAttribute('data-act');
    var data=load(),i=-1; for(var k=0;k<data.length;k++){if(data[k].id===id){i=k;break;}} if(i<0)return;
    if(act==='del'){ data.splice(i,1); }
    else if(act==='win'||act==='loss'){
      var v=prompt('Result for this trade in $ (e.g. 320 or -50):',''); if(v===null)return;
      var pnl=parseFloat(String(v).replace(/[,$%+\s]/g,'')); if(!isFinite(pnl))pnl=0;
      if(act==='loss'&&pnl>0)pnl=-pnl;
      data[i].status=act; data[i].pnl=pnl;
    }
    store(data); render();
  });
  render();
})();
</script>
<script>(function(){var L=window.mpLang;if(!L||L==='en')return;var as=document.querySelectorAll('a[href]');for(var i=0;i<as.length;i++){var h=as[i].getAttribute('href');if(h==='/')as[i].href='/'+L+'/';else if(h.charAt(0)==='/'&&h.charAt(1)==='#')as[i].href='/'+L+'/'+h.slice(1);else if(h.indexOf('/?')===0)as[i].href='/'+L+'/'+h.slice(1);else if(h.indexOf('/journal/')===0)as[i].href='/journal/?lang='+L;}})();</script>
</body>
</html>
