      +'<div class="lt-h"><span class="lt-sym">'+esc(e.sym||'—')+'</span><span class="lt-dir '+(long?'long':'short')+'">'+(long?'LONG':'SHORT')+'</span><span class="lt-live">Live <b>'+fp(m.live)+'</b> '+(m.move>=0?'↑':'↓')+' '+pctS(m.move*100)+'</span></div>'
      +'<div class="lt-grid"><div class="lt-cell"><div class="k">Entry</div><div class="v">'+fp(e.entry)+'</div></div><div class="lt-cell"><div class="k">Stop loss</div><div class="v">'+fp(e.stop)+'</div></div><div class="lt-cell"><div class="k">Take profit</div><div class="v">'+(e.tp!=null?fp(e.tp):'—')+'</div></div></div>'
      +'<div class="lt-pnl '+cls+'"><span class="big">'+(m.pnl!=null?((m.pnl>=0?'+':'−')+money(Math.abs(m.pnl)).replace('-','')):pctS(m.move*100))+'</span><span class="roe">ROE '+pctS(m.roe*100)+'</span><span class="sub">'+(m.pnl!=null?pctS(m.move*100):'')+'</span></div>'
      +'<div class="lt-meta"><span>Notional <b>'+(m.notional!=null?money(m.notional):'—')+'</b></span><span>Leverage <b>'+(e.lev||1)+'×</b></span><span>Margin <b>'+((e.margin!=null||e.riskAmt!=null)?money(e.margin!=null?e.margin:e.riskAmt):'—')+'</b></span><span>Liq. <b>'+fp(m.liq)+'</b> ('+pctS(m.liqDist)+')</span><span>ETA TP/SL <b>'+etaS+'</b></span></div>'
      +spark(e.id)
      +'<div class="lt-status"><span class="lt-dot"></span>OPEN · entry '+hms(e.ts)+' · open '+dur(Date.now()-e.ts)+'</div>'
      +'<div class="lt-btns"><button class="close" data-act="close" data-id="'+e.id+'">Close</button><button data-act="edit" data-id="'+e.id+'">Edit SL/TP</button><button data-act="del" data-id="'+e.id+'">Delete</button></div></div>';
  }
  function closedTicket(e){var win=e.status==='win',cls=win?'pf':'ls',d=e.closeTs?dur(e.closeTs-e.ts):'';
    return '<div class="lt '+cls+' lt-closed" data-id="'+e.id+'"><div class="lt-h"><span class="lt-sym">'+esc(e.sym||'—')+'</span><span class="lt-dir '+(e.side!=='short'?'long':'short')+'">'+(e.side!=='short'?'LONG':'SHORT')+'</span><span class="lt-live">'+(win?'WIN ✅':'LOSS ❌')+'</span></div>'
      +'<div class="lt-pnl '+cls+'"><span class="big">'+(e.pnl!=null?((+e.pnl>=0?'+':'−')+money(Math.abs(e.pnl)).replace('-','')):(win?'TP hit':'SL hit'))+'</span><span class="sub">'+esc(e.sym||'')+' '+fp(e.entry)+' → '+fp(e.exit!=null?e.exit:(win?e.tp:e.stop))+(d?' · '+d:'')+'</span></div>'
      +'<div class="lt-btns"><button data-act="reopen" data-id="'+e.id+'">Reopen</button><button data-act="del" data-id="'+e.id+'">Delete</button></div></div>';}
  function render(){
    var listEl=document.getElementById('jrList'),statsEl=document.getElementById('jrStats'),emptyEl=document.getElementById('jrEmpty');
    if(!listEl)return; var data=load();
    var open=data.filter(function(e){return e.status==='open';}),closed=data.filter(function(e){return e.status==='win'||e.status==='loss';});
    var wins=closed.filter(function(e){return e.status==='win';}).length,wr=closed.length?Math.round(wins/closed.length*100):null;
    var net=closed.reduce(function(s,e){return s+(+e.pnl||0);},0),unreal=0;
    open.forEach(function(e){var m=metrics(e);if(m.pnl!=null)unreal+=m.pnl;});
    function stat(v,l,c){return '<div class="jr-stat"><div class="v"'+(c?' style="color:'+c+'"':'')+'>'+v+'</div><div class="l">'+l+'</div></div>';}
    if(statsEl)statsEl.innerHTML=stat(open.length,MT('jOpen','Open'))+stat((unreal>=0?'+':'−')+money(Math.abs(unreal)).replace('-',''),MT('jUnreal','Unrealized'),unreal>=0?'#2ebd85':'#ff6258')+stat(wr==null?'—':wr+'%',MT('jWinRate','Win rate'))+stat((net>=0?'+':'−')+money(Math.abs(net)).replace('-',''),MT('jRealized','Realized'),net>=0?'#2ebd85':'#ff6258');
    var html='';
    if(open.length)html+='<div class="jr-section-t">'+MT('jOpenPos','Open positions · live')+'</div>'+open.slice().reverse().map(liveTicket).join('');
    if(closed.length)html+='<div class="jr-section-t">'+MT('jClosed','Closed')+'</div>'+closed.slice().reverse().map(closedTicket).join('');
    listEl.innerHTML=html;
    if(emptyEl)emptyEl.style.display=data.length?'none':'';
  }
  document.getElementById('jrList').addEventListener('click',function(ev){
    var b=ev.target.closest&&ev.target.closest('[data-act]'); if(!b)return;
    var id=b.getAttribute('data-id'),act=b.getAttribute('data-act');
    var data=load(),i=-1; for(var k=0;k<data.length;k++){if(data[k].id===id){i=k;break;}} if(i<0)return; var e=data[i];
    if(act==='del'){ data.splice(i,1); }
    else if(act==='close'){ var m=metrics(e); e.status=(m.pnl!=null?(m.pnl>=0?'win':'loss'):(m.move>=0?'win':'loss')); e.exit=m.live; e.closeTs=Date.now(); e.pnl=(m.pnl!=null?m.pnl:0); }
    else if(act==='reopen'){ e.status='open'; e.exit=null; e.closeTs=null; e.pnl=null; notified[id]=false; }
    else if(act==='edit'){ var ns=prompt(MT('jNewSl','New stop-loss price:'),e.stop); if(ns!==null){var v=parseFloat(ns); if(isFinite(v))e.stop=v;} var nt=prompt(MT('jNewTp','New take-profit (blank = none):'),e.tp!=null?e.tp:''); if(nt!==null){var v2=parseFloat(nt); e.tp=isFinite(v2)?v2:null;} notified[id]=false; }
    store(data); render();
  });
  function askNotif(){if(askedNotif)return;askedNotif=true;try{if('Notification'in window&&Notification.permission==='default')Notification.requestPermission();}catch(_){}}
  document.addEventListener('click',askNotif,{once:true});
  function tick(){var d=load(),changed=false;d.forEach(function(e){if(e.status==='open'){var m=metrics(e);pushHist(e.id,m.live);if(checkClose(e,m))changed=true;}});if(changed)store(d);render();}
  pollPrices(); setInterval(pollPrices,2500);
  tick(); setInterval(tick,1000);
})();
</script>
<script>(function(){var L=window.mpLang;if(!L||L==='en')return;var as=document.querySelectorAll('a[href]');for(var i=0;i<as.length;i++){var h=as[i].getAttribute('href');if(h==='/')as[i].href='/'+L+'/';else if(h.charAt(0)==='/'&&h.charAt(1)==='#')as[i].href='/'+L+'/'+h.slice(1);else if(h.indexOf('/?')===0)as[i].href='/'+L+'/'+h.slice(1);else if(h.indexOf('/journal/')===0)as[i].href='/journal/?lang='+L;}})();</script>
<script defer src="/assets/mp-nav.js"></script>
